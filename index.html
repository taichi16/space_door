<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>太空艙門入口 - 電影級擬真太空艙與深空全景</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --neon-cyan: #00f2fe;
      --neon-cyan-glow: rgba(0, 242, 254, 0.85);
      --neon-green: #10b981;
      --neon-green-glow: rgba(16, 185, 129, 0.9);
      --neon-red: #f43f5e;
      --neon-red-glow: rgba(244, 63, 94, 0.95);
      --neon-amber: #f59e0b;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000206;
      font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }

    /* 16:9 全螢幕舞台視口 */
    .portal-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }

    /* ========================================================
       1. 底層：純淨 8K 電影級擬真深空 (固定的地球、拉遠之月球與壯麗火星)
       ======================================================== */
    .deep-space-panorama {
      position: absolute;
      inset: -2%;
      width: 104%;
      height: 104%;
      background-image: url('assets/deep_space.jpg');
      background-size: cover;
      background-position: center 50%;
      z-index: 1;
      animation: spaceSlowDrift 50s ease-in-out infinite alternate;
      filter: saturate(1.12) brightness(1.05);
    }

    @keyframes spaceSlowDrift {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.02) translate(-0.5%, 0.3%); }
      100% { transform: scale(1.01) translate(0.4%, -0.3%); }
    }

    /* 星光微粒呼吸閃爍層 */
    .starlight-twinkle-layer {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(1.2px 1.2px at 45px 65px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.8px 1.8px at 180px 120px, #a5f3fc, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 320px 280px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2.2px 2.2px at 540px 180px, #fef08a, rgba(0,0,0,0)),
        radial-gradient(1.4px 1.4px at 780px 420px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 960px 150px, #93c5fd, rgba(0,0,0,0)),
        radial-gradient(1.6px 1.6px at 1240px 320px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.8px 1.8px at 1520px 210px, #e0f2fe, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 750px 550px;
      opacity: 0.85;
      z-index: 2;
      pointer-events: none;
      animation: twinklePulse 4s infinite alternate ease-in-out;
    }

    @keyframes twinklePulse {
      0% { opacity: 0.65; }
      50% { opacity: 1; }
      100% { opacity: 0.75; }
    }

    /* 深空遙測資訊 HUD */
    .space-telemetry {
      position: absolute;
      bottom: 24px;
      left: 36px;
      z-index: 3;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(56, 189, 248, 0.75);
      line-height: 1.6;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    /* ========================================================
       2. 中層：星際氣密艙門總成 (固定外門框 + 內部左右滑動門板)
       ======================================================== */
    .airlock-chamber {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
      transform-origin: 50% 52%;
      transition: transform 2.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.8s ease-in-out;
    }

    /* 視角往門外推進：艙門總成向前縮放穿過鏡頭 (Camera Dolly Forward Into Deep Space) */
    .camera-dolly-in .airlock-chamber {
      transform: scale(3.2);
      opacity: 0;
      pointer-events: none;
    }

    /* 推進時深空星系微幅視差縮放 */
    .camera-dolly-in .deep-space-panorama {
      transform: scale(1.08);
    }

    /* ========================================================
       2A. 內部可開啟的左右雙扇裝甲門板 (位於門框後方層，向兩側滑入門框凹槽)
       ======================================================== */
    .inner-doors-container {
      position: absolute;
      inset: 0;
      z-index: 11;
      pointer-events: none;
    }

    .inner-door-leaf {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('assets/scifi_door.jpg');
      background-size: 100vw 100vh;
      background-repeat: no-repeat;
      transition: transform 1.8s cubic-bezier(0.77, 0, 0.175, 1);
    }

    /* 左內門扇：精確裁切紅線內部左半邊門片 */
    .inner-door-left {
      left: 0;
      clip-path: polygon(
        24.5% 20.5%,
        50.05% 20.5%,
        50.05% 94.0%,
        18.5% 94.0%,
        11.2% 81.5%,
        11.2% 43.5%
      );
      -webkit-clip-path: polygon(
        24.5% 20.5%,
        50.05% 20.5%,
        50.05% 94.0%,
        18.5% 94.0%,
        11.2% 81.5%,
        11.2% 43.5%
      );
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.9);
    }

    /* 右內門扇：精確裁切紅線內部右半邊門片 */
    .inner-door-right {
      left: 0;
      clip-path: polygon(
        49.95% 20.5%,
        75.5% 20.5%,
        88.8% 43.5%,
        88.8% 81.5%,
        81.5% 94.0%,
        49.95% 94.0%
      );
      -webkit-clip-path: polygon(
        49.95% 20.5%,
        75.5% 20.5%,
        88.8% 43.5%,
        88.8% 81.5%,
        81.5% 94.0%,
        49.95% 94.0%
      );
      box-shadow: -10px 0 35px rgba(0, 0, 0, 0.9);
    }

    /* 門開啟時：左門片向左滑入左門框深處，右門片向右滑入右門框深處 (外門框保持不動) */
    .doors-sliding .inner-door-left {
      transform: translateX(-42vw);
    }
    .doors-sliding .inner-door-right {
      transform: translateX(42vw);
    }
    .doors-sliding .neon-door-lock-strip {
      opacity: 0;
      transform: translate(-50%, -50%) scaleY(0.1);
    }

    /* 門扇中央鎖定部位的垂直青藍霓虹光條 */
    .neon-door-lock-strip {
      position: absolute;
      top: 57.25%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 73.5vh;
      background: var(--neon-cyan);
      box-shadow: 0 0 16px var(--neon-cyan), 0 0 35px var(--neon-cyan-glow);
      z-index: 12;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.6s ease;
      animation: neonBreathe 2.4s infinite alternate ease-in-out;
    }

    /* ========================================================
       2B. 外部固定不動的重型裝甲門框 (八角形氣密開孔，覆蓋於門板上方)
       ======================================================== */
    .outer-bulkhead-frame {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('assets/scifi_door.jpg');
      background-size: 100vw 100vh;
      background-repeat: no-repeat;
      z-index: 13;
      pointer-events: none;
      clip-path: polygon(
        evenodd,
        0% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%,
        24.5% 20.5%,
        75.5% 20.5%,
        88.8% 43.5%,
        88.8% 81.5%,
        81.5% 94.0%,
        18.5% 94.0%,
        11.2% 81.5%,
        11.2% 43.5%,
        24.5% 20.5%
      );
      -webkit-clip-path: polygon(
        evenodd,
        0% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%,
        24.5% 20.5%,
        75.5% 20.5%,
        88.8% 43.5%,
        88.8% 81.5%,
        81.5% 94.0%,
        18.5% 94.0%,
        11.2% 81.5%,
        11.2% 43.5%,
        24.5% 20.5%
      );
    }

    /* 門框內緣立體倒角陰影與氣密槽光影 */
    .doorway-aperture-rim {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 14;
      clip-path: polygon(
        24.5% 20.5%,
        75.5% 20.5%,
        88.8% 43.5%,
        88.8% 81.5%,
        81.5% 94.0%,
        18.5% 94.0%,
        11.2% 81.5%,
        11.2% 43.5%
      );
      -webkit-clip-path: polygon(
        24.5% 20.5%,
        75.5% 20.5%,
        88.8% 43.5%,
        88.8% 81.5%,
        81.5% 94.0%,
        18.5% 94.0%,
        11.2% 81.5%,
        11.2% 43.5%
      );
      box-shadow: 
        inset 0 0 30px rgba(0, 0, 0, 0.95),
        inset 0 0 70px rgba(0, 0, 0, 0.8),
        inset 0 0 8px rgba(0, 242, 254, 0.4);
    }

    /* ========================================================
       3. 霓虹燈光效增強層 (固定於外門框機械組件上)
       ======================================================== */
    /* 頂部兩組吊掛機械支架的青藍霓虹燈條 */
    .neon-bracket-light {
      position: absolute;
      top: 15%;
      width: 48px;
      height: 8px;
      background: var(--neon-cyan);
      box-shadow: 0 0 16px var(--neon-cyan), 0 0 35px var(--neon-cyan-glow);
      border-radius: 2px;
      animation: neonBreathe 2.8s infinite alternate ease-in-out;
      z-index: 15;
    }
    .neon-bracket-left { left: 18%; }
    .neon-bracket-right { right: 18%; }

    /* 兩側立柱側邊的疊加發光散熱槽霓虹燈 */
    .neon-pillar-strip {
      position: absolute;
      width: 6px;
      height: 38px;
      background: var(--neon-cyan);
      box-shadow: 0 0 14px var(--neon-cyan), 0 0 28px var(--neon-cyan-glow);
      border-radius: 3px;
      animation: neonBreathe 3.2s infinite alternate ease-in-out;
      z-index: 15;
    }
    .neon-pillar-strip.left { left: 3.1vw; }
    .neon-pillar-strip.right { right: 3.1vw; }
    .neon-pillar-strip-1 { top: 56%; }
    .neon-pillar-strip-2 { top: 64%; }
    .neon-pillar-strip-3 { top: 72%; }

    @keyframes neonBreathe {
      0% { opacity: 0.75; filter: brightness(0.9); }
      50% { opacity: 1; filter: brightness(1.4); }
      100% { opacity: 0.75; filter: brightness(0.9); }
    }

    /* 門頂中央狀態紅綠指示燈 (固定於天花板中心，絕不被投影儀遮蔽) */
    .airlock-status-beacon {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: rgba(10, 16, 28, 0.95);
      border: 2px solid #334155;
      padding: 6px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.95), 0 0 15px rgba(15, 23, 42, 0.9);
      display: flex;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(8px);
    }

    .beacon-unit {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .beacon-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: #64748b;
      letter-spacing: 1px;
    }

    .beacon-divider {
      width: 1px;
      height: 14px;
      background: #334155;
    }

    .beacon-lamp {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid #334155;
      transition: all 0.3s;
    }
    .beacon-lamp.red { background: #3b0707; }
    .beacon-lamp.green { background: #042f1a; }

    .beacon-lamp.red.alarm-strobe,
    .hud-indicator.red.alarm-strobe {
      background: #f43f5e;
      box-shadow: 0 0 25px #f43f5e, 0 0 50px #e11d48, inset 0 0 6px #ffffff;
      animation: alertStrobe 0.16s infinite alternate;
    }
    .beacon-lamp.green.active-on,
    .beacon-lamp.green.success-strobe,
    .hud-indicator.green.active-on {
      background: #10b981;
      box-shadow: 0 0 25px #10b981, 0 0 55px #059669, inset 0 0 6px #ffffff;
      animation: alertStrobe 0.18s infinite alternate;
    }

    @keyframes alertStrobe {
      from { opacity: 0.2; }
      to { opacity: 1; }
    }

    /* 開門瞬間氣密洩壓白霧蒸氣畫布 */
    #steamCanvas {
      position: absolute;
      inset: 0;
      z-index: 18;
      pointer-events: none;
    }

    /* ========================================================
       4. 擬真實體全息投影燈組 (開門時自動收合縮回天花板)
       ======================================================== */
    .projector-assembly {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      z-index: 24;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.65s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.5s ease;
    }

    /* 開門後依邏輯完全收起 (Retract into ceiling bulkhead) */
    .projector-assembly.retracted {
      transform: translateX(-50%) translateY(-115%);
      opacity: 0;
      pointer-events: none;
    }

    .projector-assembly.retracted .volumetric-beam-cone,
    .projector-assembly.retracted .volumetric-god-rays,
    .projector-assembly.retracted .beam-laser-scanner,
    .projector-assembly.retracted .anamorphic-flare-line {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* 投影儀金屬安裝基座 */
    .projector-mount {
      position: relative;
      background: linear-gradient(180deg, #1e293b 0%, #0d1522 70%, #030712 100%);
      border: 2px solid #475569;
      border-top: none;
      border-radius: 0 0 18px 18px;
      padding: 6px 32px 10px;
      box-shadow: 
        0 8px 35px rgba(0, 0, 0, 0.95),
        0 0 20px rgba(0, 242, 254, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .projector-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      letter-spacing: 3px;
      color: #64748b;
      text-transform: uppercase;
    }

    /* 雙光學菲涅爾透鏡投射口 */
    .projector-lens-box {
      position: relative;
      width: 74px;
      height: 22px;
      background: radial-gradient(circle at 50% 50%, #083344 0%, #020617 100%);
      border: 2px solid #0284c7;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 
        inset 0 0 10px #00f2fe,
        0 0 20px rgba(0, 242, 254, 0.7);
    }

    /* 高能光子發射燈芯 */
    .lens-emitter-core {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 10%, #00f2fe 50%, #0284c7 90%);
      box-shadow: 
        0 0 15px #ffffff,
        0 0 30px #00f2fe,
        0 0 50px rgba(0, 242, 254, 0.9);
      animation: emitterCoreGlow 2s infinite alternate ease-in-out;
    }

    @keyframes emitterCoreGlow {
      0% { transform: scale(0.9); filter: brightness(1); }
      100% { transform: scale(1.15); filter: brightness(1.5); }
    }

    /* 橫向變形鏡頭眩光 */
    .anamorphic-flare-line {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 2.5px;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(0, 242, 254, 0.2) 20%, 
        #00f2fe 45%, 
        #ffffff 50%, 
        #00f2fe 55%, 
        rgba(0, 242, 254, 0.2) 80%, 
        transparent 100%
      );
      box-shadow: 0 0 12px #00f2fe, 0 0 25px rgba(0, 242, 254, 0.8);
      pointer-events: none;
    }

    /* 逼真的立體體積光錐 */
    .volumetric-beam-cone {
      position: absolute;
      top: 42px;
      width: 520px;
      height: 560px;
      background: linear-gradient(180deg, 
        rgba(0, 242, 254, 0.75) 0%, 
        rgba(0, 242, 254, 0.35) 25%, 
        rgba(0, 242, 254, 0.12) 65%, 
        rgba(0, 242, 254, 0.02) 90%, 
        transparent 100%
      );
      clip-path: polygon(46% 0%, 54% 0%, 98% 100%, 2% 100%);
      pointer-events: none;
      filter: blur(8px);
      opacity: 0.88;
      transition: opacity 0.5s ease;
      animation: beamSubtleFlicker 6s infinite ease-in-out;
    }

    /* 射束放射狀光束 (God Rays) */
    .volumetric-god-rays {
      position: absolute;
      top: 42px;
      width: 520px;
      height: 560px;
      clip-path: polygon(46% 0%, 54% 0%, 98% 100%, 2% 100%);
      background-image: repeating-linear-gradient(
        -80deg,
        rgba(255, 255, 255, 0.08) 0px,
        rgba(255, 255, 255, 0.08) 6px,
        transparent 6px,
        transparent 28px
      );
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.7;
      animation: rayShift 8s infinite alternate ease-in-out;
    }

    @keyframes rayShift {
      0% { transform: scaleX(1); opacity: 0.5; }
      100% { transform: scaleX(1.05); opacity: 0.8; }
    }

    /* 雷射光學垂直掃描光刀 */
    .beam-laser-scanner {
      position: absolute;
      top: 42px;
      width: 500px;
      height: 18px;
      background: linear-gradient(180deg, 
        transparent 0%, 
        rgba(0, 242, 254, 0.45) 50%, 
        #ffffff 80%, 
        rgba(0, 242, 254, 0.45) 90%, 
        transparent 100%
      );
      clip-path: polygon(44% 0%, 56% 0%, 98% 100%, 2% 100%);
      box-shadow: 0 0 15px #00f2fe;
      opacity: 0.75;
      animation: scanLaserCycle 3.5s infinite linear;
    }

    @keyframes scanLaserCycle {
      0% { top: 42px; opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { top: 480px; opacity: 0; }
    }

    @keyframes beamSubtleFlicker {
      0%, 100% { opacity: 0.88; }
      24% { opacity: 0.85; }
      25% { opacity: 0.72; }
      26% { opacity: 0.88; }
      68% { opacity: 0.92; }
      69% { opacity: 0.78; }
      70% { opacity: 0.88; }
    }

    /* 懸浮全息投影驗證 HUD (底部受頂部光錐照射具光學反光) */
    .hologram-hud {
      position: absolute;
      z-index: 26;
      width: 390px;
      padding: 30px 26px 24px;
      background: rgba(6, 22, 40, 0.72);
      border: 1.5px solid rgba(0, 242, 254, 0.75);
      border-top: 2.5px solid #ffffff;
      border-radius: 14px;
      box-shadow: 
        0 -10px 40px rgba(0, 242, 254, 0.65),
        0 0 45px rgba(0, 242, 254, 0.4),
        inset 0 10px 25px rgba(255, 255, 255, 0.25),
        inset 0 0 25px rgba(0, 242, 254, 0.22),
        0 25px 60px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(14px);
      color: #38bdf8;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hologram-hud::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: linear-gradient(
        rgba(0, 242, 254, 0) 50%,
        rgba(0, 242, 254, 0.1) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
      opacity: 0.9;
    }

    .hud-bracket {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: #00f2fe;
      border-style: solid;
      pointer-events: none;
    }
    .hb-tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-top-left-radius: 6px; }
    .hb-tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-top-right-radius: 6px; }
    .hb-bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-bottom-left-radius: 6px; }
    .hb-br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-bottom-right-radius: 6px; }

    /* 開門時全息淡出消散收起 */
    .hologram-hud.dismiss {
      opacity: 0;
      transform: scale(0.75) translateY(-25px);
      pointer-events: none;
    }

    .hud-header {

    .hud-header .sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;

    .hud-header .title {

    .hud-status-text {
      text-align: center;
      font-family: 'Share Tech Mono', monospace;

    .hud-status-text.error {
      color: #f87171;
      text-shadow: 0 0 10px rgba(248, 113, 113, 0.8);
    }
    .hud-status-text.success {
      color: #4ade80;
      text-shadow: 0 0 10px rgba(74, 222, 128, 0.8);
    }

    @keyframes hudShake {
      0%, 100% { transform: translate(-50%, -50%); }
      20%, 60% { transform: translate(calc(-50% - 8px), -50%); }
      40%, 80% { transform: translate(calc(-50% + 8px), -50%); }
    }
    .hologram-hud.alarm-shake {
      animation: hudShake 0.45s ease-in-out;
      border-color: rgba(244, 63, 94, 0.8) !important;
      box-shadow: 0 0 45px rgba(244, 63, 94, 0.5), inset 0 0 30px rgba(244, 63, 94, 0.25) !important;
    }

    /* ========================================================
       5. 閉門重置列 (全開後浮現於底端)
       ======================================================== */
    .reclose-bar {
      position: absolute;
      bottom: 30px;
      z-index: 30;
      display: none;
      animation: recloseFade 0.6s ease forwards;
    }
    .reclose-bar button {
      background: rgba(15, 23, 42, 0.92);
      color: #38bdf8;
      border: 1.5px solid #00f2fe;
      padding: 11px 32px;
      font-size: 14px;
      letter-spacing: 2px;
      border-radius: 24px;
      cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.5), inset 0 0 12px rgba(0, 242, 254, 0.25);
      transition: all 0.25s;
    }
    .reclose-bar button:hover {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 0 45px rgba(0, 242, 254, 0.95);
      transform: scale(1.05);
    }

    @keyframes recloseFade {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="portal-stage" id="stage">
  <!-- 1. 底層：純淨 8K 深空銀河全景 (地球、拉遠之月球、火星一體成型，絕對零重影、零錯位) -->
  <div class="deep-space-panorama" id="deepSpaceBg"></div>
  <div class="starlight-twinkle-layer"></div>

  <!-- 深空遙測訊號 -->
  <div class="space-telemetry">
    AIRLOCK PROTOCOL: SC-MODULE-09 // STATION: LEO GATE<br>
    CELESTIAL VIEW: REAL-TIME EARTH, LUNA & MARS ALIGNMENT<br>
    CABIN PRESSURE: 101.3 KPA // HERMETIC SEAL VERIFIED
  </div>

  <!-- 2. 中層：星際氣密艙門總成 (固定外門框 + 內部左右滑動門板) -->
  <div class="airlock-chamber" id="airlockChamber">
    <!-- 內部可開啟的左右雙扇裝甲門板 (向兩側滑入門框凹槽) -->
    <div class="inner-doors-container">
      <!-- 左內門扇 -->
      <div class="inner-door-leaf inner-door-left"></div>
      <!-- 右內門扇 -->
      <div class="inner-door-leaf inner-door-right"></div>
      <!-- 門扇中央鎖定部位垂直發光光條 -->
      <div class="neon-door-lock-strip"></div>
    </div>

    <!-- 外部固定不動的重型裝甲門框 (八角形氣密開孔，覆蓋於門板上方) -->
    <div class="outer-bulkhead-frame">
      <!-- 門框內緣立體倒角光影 -->
      <div class="doorway-aperture-rim"></div>

      <!-- 頂部吊掛機械支架的青藍霓虹燈條 -->
      <div class="neon-bracket-light neon-bracket-left"></div>
      <div class="neon-bracket-light neon-bracket-right"></div>

      <!-- 側柱散熱模組發光霓虹燈條 (左) -->
      <div class="neon-pillar-strip neon-pillar-strip-1 left"></div>
      <div class="neon-pillar-strip neon-pillar-strip-2 left"></div>
      <div class="neon-pillar-strip neon-pillar-strip-3 left"></div>

      <!-- 側柱散熱模組發光霓虹燈條 (右) -->
      <div class="neon-pillar-strip neon-pillar-strip-1 right"></div>
      <div class="neon-pillar-strip neon-pillar-strip-2 right"></div>
      <div class="neon-pillar-strip neon-pillar-strip-3 right"></div>
    </div>
  </div>

  <!-- 門頂指示燈組 (固定於天花板中心，絕不被投影儀遮蔽) -->
  <div class="airlock-status-beacon">
    <div class="beacon-unit">
      <div class="beacon-lamp red" id="lampRed" title="DOOR LOCKED // ACCESS DENIED"></div>
      <span class="beacon-text">LOCK</span>
    </div>
    <div class="beacon-divider"></div>
    <div class="beacon-unit">
      <div class="beacon-lamp green" id="lampGreen" title="DOOR UNLOCKED // ACCESS GRANTED"></div>
      <span class="beacon-text">OPEN</span>
    </div>
  </div>

  <!-- 開門洩壓白霧蒸氣畫布 -->
  <canvas id="steamCanvas"></canvas>

  <!-- 3. 頂部擬真實體全息投影燈組 (開門時自動收合縮回天花板) -->
  <div class="projector-assembly" id="projectorAssembly">
    <div class="projector-mount">
      <div class="projector-label">COHERENT OPTICAL EMITTER // PROJ-04</div>
      <div class="projector-lens-box">
        <div class="lens-emitter-core"></div>
        <div class="anamorphic-flare-line"></div>
      </div>
    </div>

    <!-- 體積光錐、散射光柱與雷射垂直掃描刀 -->
    <div class="volumetric-beam-cone"></div>
    <div class="volumetric-god-rays"></div>
    <div class="beam-laser-scanner"></div>
  </div>

  <!-- 4. 懸浮全息投影驗證 HUD 面板 -->
  <div class="hologram-hud" id="holoHud">
    <div class="hud-bracket hb-tl"></div>
    <div class="hud-bracket hb-tr"></div>
    <div class="hud-bracket hb-bl"></div>
    <div class="hud-bracket hb-br"></div>

    <div class="hud-header">
      <div class="sub">CYBERNETIC AIRLOCK ACCESS</div>
      <div class="title">艙門安全憑證認證</div>
    </div>

    <div class="form-group">
      <label><span>SECURITY ID</span><span>[OPERATOR]</span></label>
      <input type="text" id="userInput" placeholder="請輸入帳號" autocomplete="off">
    </div>

    <div class="form-group">
      <label><span>ACCESS PASSCODE</span><span>[ENCRYPTED]</span></label>
      <input type="password" id="passInput" placeholder="請輸入密碼" autocomplete="off">
    </div>

    <div class="btn-cluster">
      <button class="btn btn-submit" onclick="handleAuth()">驗證憑證並全開艙門</button>
      <div class="quick-bar">
        <button class="btn btn-chip" onclick="autoFill('commander', 'earth-2026')">帶入授權憑證</button>
        <button class="btn btn-chip" onclick="autoFill('intruder', 'wrong-pass')">帶入錯誤憑證</button>
      </div>
    </div>

    <div class="hud-status-bar" id="hudStatusBar">
      <span class="hud-indicator red" id="hudLampRed"></span>
      <div class="hud-status-text" id="hudStatus">AWAITING CREDENTIALS...</div>
      <span class="hud-indicator green" id="hudLampGreen"></span>
    </div>
  </div>

  <!-- 5. 閉門重置列 (全開後浮現於底端) -->
  <div class="reclose-bar" id="recloseBar">
    <button onclick="handleReclose()">⟲ 重新關閉並鎖定艙門</button>
  </div>
</div>

<script>
  /* ====================================================================
     A. 授權常數與節點引用
     ==================================================================== */
  const AUTH_USER = "commander";
  const AUTH_PASS = "earth-2026";

  const stage = document.getElementById("stage");
  const lampRed = document.getElementById("lampRed");
  const lampGreen = document.getElementById("lampGreen");
  const holoHud = document.getElementById("holoHud");
  const projectorAssembly = document.getElementById("projectorAssembly");
  const recloseBar = document.getElementById("recloseBar");
  const userInput = document.getElementById("userInput");
  const passInput = document.getElementById("passInput");
  const hudStatus = document.getElementById("hudStatus");
  const hudLampRed = document.getElementById("hudLampRed");
  const hudLampGreen = document.getElementById("hudLampGreen");
  const hudStatusBar = document.getElementById("hudStatusBar");

  /* ====================================================================
     B. Web Audio API 科幻音效合成 (氣密閥洩壓、全息操作與艙門機械聲)
     ==================================================================== */
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, type, duration, delay = 0, gainVal = 0.12) {
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      setTimeout(() => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(gainVal, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      }, delay * 1000);
    } catch(e) {}
  }

  function playDecompressionSound() {
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const bufferSize = ctx.sampleRate * 1.5;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(900, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 1.4);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.35, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.4);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start();
    } catch (e) {}
  }

  function playSuccessSound() {
    playTone(523.25, 'sine', 0.25, 0.0, 0.15); // C5
    playTone(659.25, 'sine', 0.3, 0.12, 0.15);  // E5
    playTone(783.99, 'sine', 0.45, 0.24, 0.18); // G5
  }

  function playAlarmSound() {
    playTone(220, 'sawtooth', 0.18, 0, 0.16);
    playTone(180, 'sawtooth', 0.22, 0.16, 0.16);
  }

  /* ====================================================================
     C. 開門瞬間的氣密洩壓白霧蒸氣 (Steam Burst Canvas)
     ==================================================================== */
  const steamCanvas = document.getElementById("steamCanvas");
  const sCtx = steamCanvas.getContext("2d");
  let steamParticles = [];

  function resizeSteamCanvas() {
    steamCanvas.width = window.innerWidth;
    steamCanvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeSteamCanvas);
  resizeSteamCanvas();

  function triggerSteamJets() {
    steamParticles = [];
    const centerX = steamCanvas.width / 2;
    const h = steamCanvas.height;

    for (let i = 0; i < 150; i++) {
      const y = Math.random() * (h * 0.7) + (h * 0.15);
      const speed = (Math.random() * 9 + 4) * (Math.random() > 0.5 ? 1 : -1);
      steamParticles.push({
        x: centerX + (Math.random() * 8 - 4),
        y: y,
        vx: speed,
        vy: (Math.random() - 0.5) * 2,
        radius: Math.random() * 18 + 8,
        alpha: Math.random() * 0.75 + 0.25,
        life: 1.0,
        decay: Math.random() * 0.02 + 0.015
      });
    }
  }

  function updateSteam() {
    sCtx.clearRect(0, 0, steamCanvas.width, steamCanvas.height);
    for (let i = steamParticles.length - 1; i >= 0; i--) {
      const p = steamParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.radius += 1.1;
      p.life -= p.decay;

      if (p.life <= 0) {
        steamParticles.splice(i, 1);
        continue;
      }

      const grad = sCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
      grad.addColorStop(0, `rgba(224, 242, 254, ${p.alpha * p.life})`);
      grad.addColorStop(0.5, `rgba(186, 230, 253, ${p.alpha * p.life * 0.4})`);
      grad.addColorStop(1, 'rgba(186, 230, 253, 0)');

      sCtx.fillStyle = grad;
      sCtx.beginPath();
      sCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      sCtx.fill();
    }
    requestAnimationFrame(updateSteam);
  }
  updateSteam();

  /* ====================================================================
     D. 互動控制與艙門開閉邏輯 (嚴格符合物理與機械邏輯)
     ==================================================================== */
  let authResetTimer = null;

  function autoFill(u, p) {
    if (authResetTimer) {
      clearTimeout(authResetTimer);
      authResetTimer = null;
    }
    lampRed.className = "beacon-lamp red";
    lampGreen.className = "beacon-lamp green";
    if (hudLampRed) hudLampRed.className = "hud-indicator red";
    if (hudLampGreen) hudLampGreen.className = "hud-indicator green";
    if (hudStatusBar) hudStatusBar.className = "hud-status-bar";
    holoHud.classList.remove("alarm-shake");
    userInput.value = u;
    passInput.value = p;
    playTone(440, 'sine', 0.08);
    hudStatus.className = "hud-status-text";
    hudStatus.textContent = "CREDENTIALS LOADED";
  }

  function handleAuth() {
    if (authResetTimer) {
      clearTimeout(authResetTimer);
      authResetTimer = null;
    }

    const u = userInput.value.trim();
    const p = passInput.value.trim();

    lampRed.className = "beacon-lamp red";
    lampGreen.className = "beacon-lamp green";
    if (hudLampRed) hudLampRed.className = "hud-indicator red";
    if (hudLampGreen) hudLampGreen.className = "hud-indicator green";
    if (hudStatusBar) hudStatusBar.className = "hud-status-bar";
    holoHud.classList.remove("alarm-shake");

    if (u === AUTH_USER && p === AUTH_PASS) {
      // 1. 驗證成功：天花板與 HUD 綠燈同步閃爍、音效
      lampGreen.classList.add("active-on");
      if (hudLampGreen) hudLampGreen.classList.add("active-on");
      if (hudStatusBar) hudStatusBar.className = "hud-status-bar success";
      hudStatus.className = "hud-status-text success";
      hudStatus.textContent = "ACCESS GRANTED // RETRACTING PROJECTOR";
      playSuccessSound();

      // 2. 嚴格符合邏輯：開門前全息 HUD 消散，整座投影燈具與光束完全縮回天花板收納槽！
      holoHud.classList.add("dismiss");
      projectorAssembly.classList.add("retracted");

      // 3. 噴射白霧氣爆
      setTimeout(() => {
        triggerSteamJets();
        playDecompressionSound();
      }, 300);

      // 4. 第一階段：僅開啟內部的門（向兩側滑開收入門框凹槽，外門框保持不動）
      setTimeout(() => {
        stage.classList.add("doors-sliding");
        playTone(160, 'sawtooth', 1.2, 0, 0.08);
      }, 500);

      // 5. 第二階段：內門完全開啟後，將視野往門外推進看到星空 (Camera Dolly Forward)
      setTimeout(() => {
        stage.classList.add("camera-dolly-in");
        playTone(110, 'sine', 1.8, 0, 0.12);
      }, 2300);

      // 6. 浮現重新關閉艙門控制列
      setTimeout(() => {
        recloseBar.style.display = "block";
      }, 4200);

    } else {
      // 驗證失敗：天花板與 HUD 紅燈急促閃爍、警告音、全息面板告警震動
      lampRed.classList.add("alarm-strobe");
      if (hudLampRed) hudLampRed.classList.add("alarm-strobe");
      if (hudStatusBar) hudStatusBar.className = "hud-status-bar error";
      hudStatus.className = "hud-status-text error";
      hudStatus.textContent = "ACCESS DENIED // PASSCODE INVALID";
      holoHud.classList.add("alarm-shake");
      playAlarmSound();

      authResetTimer = setTimeout(() => {
        lampRed.classList.remove("alarm-strobe");
        if (hudLampRed) hudLampRed.classList.remove("alarm-strobe");
        if (hudStatusBar) hudStatusBar.className = "hud-status-bar";
        hudStatus.className = "hud-status-text";
        hudStatus.textContent = "AWAITING CREDENTIALS...";
        holoHud.classList.remove("alarm-shake");
        authResetTimer = null;
      }, 2000);
    }
  }

  function handleReclose() {
    if (authResetTimer) {
      clearTimeout(authResetTimer);
      authResetTimer = null;
    }
    recloseBar.style.display = "none";
    hudStatus.className = "hud-status-text";
    hudStatus.textContent = "RETRACTING VIEW // SEALING AIRLOCK...";

    // 1. 第一階段：視角由深空拉回艙內 (Camera Dolly Back to Interior)
    stage.classList.remove("camera-dolly-in");
    playTone(140, 'sine', 1.5, 0, 0.1);

    // 2. 第二階段：視角回正後，內部兩扇裝甲門合攏鎖定 (Doors Slide Inward & Lock)
    setTimeout(() => {
      stage.classList.remove("doors-sliding");
      playTone(180, 'sawtooth', 1.2, 0, 0.08);
      setTimeout(() => {
        playTone(80, 'sine', 0.4, 0, 0.25);
        playTone(330, 'sine', 0.25, 0);
      }, 1600);
    }, 1800);

    // 3. 第三階段：天花板投影儀滑出降下，投射全息 HUD 面板
    setTimeout(() => {
      lampGreen.className = "beacon-lamp green";
      lampRed.className = "beacon-lamp red";
      if (hudLampRed) hudLampRed.className = "hud-indicator red";
      if (hudLampGreen) hudLampGreen.className = "hud-indicator green";
      if (hudStatusBar) hudStatusBar.className = "hud-status-bar";
      holoHud.classList.remove("alarm-shake");

      projectorAssembly.classList.remove("retracted");
      setTimeout(() => {
        holoHud.classList.remove("dismiss");
        hudStatus.textContent = "AWAITING CREDENTIALS...";
        playTone(660, 'sine', 0.15, 0.1);
      }, 400);
    }, 3800);
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !holoHud.classList.contains("dismiss")) {
      handleAuth();
    }
  });
</script>

</body>
</html>
